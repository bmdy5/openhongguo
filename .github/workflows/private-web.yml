name: Private web adapter
on:
  pull_request:
    paths: ['web/**', '.github/workflows/private-web.yml']
  push:
    paths: ['web/**', '.github/workflows/private-web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check src/main.mjs && node --check scripts/catalog.mjs
